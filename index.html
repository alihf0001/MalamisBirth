<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برای تو</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #1a1423;
      --bg-soft: #241c31;
      --card: #2e253d;
      --text: #f3ebe0;
      --text-dim: #c4b8a8;
      --accent: #d4a574;
      --accent-2: #c47a5a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    #lockScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #2a1f3d 0%, #1a1423 70%);
      z-index: 100;
      transition: opacity 1s ease;
    }
    #lockScreen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none; /* این خط خیلی مهمه */
      background-image: 
        radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 160px 120px, rgba(255,255,255,0.9), transparent),
        radial-gradient(1px 1px at 230px 80px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 300px 150px, rgba(255,255,255,0.7), transparent);
      background-size: 400px 300px;
      opacity: 0.6;
      animation: twinkle 7s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.4; }
      to { opacity: 0.75; }
    }

    .moon {
      font-size: 62px;
      margin-bottom: 18px;
      animation: float 5s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .lock-title {
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 10px;
      z-index: 2;
    }

    .lock-poem {
      font-size: 15px;
      color: var(--text-dim);
      line-height: 1.9;
      text-align: center;
      max-width: 300px;
      margin-bottom: 30px;
      min-height: 55px;
      z-index: 2;
    }

    #pw {
      width: 250px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #3d3450;
      background: #241c31;
      color: var(--text);
      font-size: 16px;
      text-align: center;
      outline: none;
      z-index: 5;
      position: relative;
    }
    #pw:focus { border-color: var(--accent); }

    #unlockBtn {
      margin-top: 14px;
      padding: 12px 34px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #d4a574, #c47a5a);
      color: #1a1423;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      z-index: 5;
      position: relative;
    }

    #err {
      color: #e8a0a0;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
      z-index: 5;
    }

    /* محتوای اصلی */
    #contentScreen {
      display: none;
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    #contentScreen.show { display: block; }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 24px;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .header p { color: var(--text-dim); font-size: 14px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .tab {
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
    }
    .tab.active {
      background: linear-gradient(135deg, #d4a574, #c47a5a);
      color: #1a1423;
      font-weight: 600;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .meta {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.7;
    }
    .meta span { color: var(--accent); }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="stars"></div>
    <div class="moon">🌙</div>
    <div class="lock-title">برای تو</div>
    <div class="lock-poem" id="poem"></div>

    <input type="password" id="pw" placeholder="رمز ورود" autocomplete="off" />
    <button id="unlockBtn">باز کن</button>
    <div id="err"></div>
  </div>

  <div id="contentScreen">
    <div class="header">
      <h1>تولدت مبارک</h1>
      <p>یه گوشه از دل من برات</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="beauty">زیبایی‌ها</div>
      <div class="tab" data-tab="quotes">جملات قصار</div>
      <div class="tab" data-tab="memories">خاطرات</div>
      <div class="tab" data-tab="friends">همراهان</div>
      <div class="tab" data-tab="us">ما</div>
    </div>

    <div class="panel active" id="panel-beauty">
      <div class="card">
        <img src="https://picsum.photos/600/400?random=11" alt="">
        <div class="meta">
          <div><span>تاریخ:</span> ۱۲ شهریور ۱۴۰۳</div>
          <div><span>مکان:</span> کافه</div>
          <div><span>فرستنده:</span> من</div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-quotes">
      <div class="card">اینجا جملات قصار می‌آید...</div>
    </div>
    <div class="panel" id="panel-memories">
      <div class="card">خاطرات به‌زودی...</div>
    </div>
    <div class="panel" id="panel-friends">
      <div class="card">حرف‌های دوستان...</div>
    </div>
    <div class="panel" id="panel-us">
      <div class="card">بخش ما...</div>
    </div>
  </div>

  <script>
    // شعر
    const poemText = `در این شبِ پاییزی
ستاره‌ها به یاد تو روشن‌اند`;
    const poemEl = document.getElementById('poem');
    let idx = 0;
    function type() {
      if (idx <= poemText.length) {
        poemEl.textContent = poemText.slice(0, idx);
        idx++;
        setTimeout(type, 65);
      }
    }
    setTimeout(type, 500);

    // رمز
    const CORRECT_PASSWORD = "test123";

    const lockScreen = document.getElementById('lockScreen');
    const contentScreen = document.getElementById('contentScreen');
    const pw = document.getElementById('pw');
    const btn = document.getElementById('unlockBtn');
    const err = document.getElementById('err');

    function tryUnlock() {
      if (pw.value.trim() === CORRECT_PASSWORD) {
        lockScreen.classList.add('hide');
        setTimeout(() => {
          lockScreen.style.display = 'none';
          contentScreen.classList.add('show');
        }, 900);
      } else {
        err.textContent = 'رمز درست نیست';
      }
    }

    btn.addEventListener('click', tryUnlock);
    pw.addEventListener('keydown', e => {
      if (e.key === 'Enter') tryUnlock();
    });

    // تب‌ها
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      });
    });
  </script>
</body>
</html>
