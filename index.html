<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>یک هدیه‌ی کوچولو 🌙</title>
<style>
  :root{
    --bg: #171426;
    --bg-soft: #201c34;
    --card: #2a2440;
    --text: #f3eee6;
    --text-dim: #b9b3c8;
    --accent: #d7b8ff;
    --accent-2: #f2c9a0;
    --error: #ff9a9a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', Tahoma, 'B Nazanin', Arial, sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- صفحه‌ی قفل ---------- */
  #lockScreen{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 24px;
    text-align:center;
  }
  .moon{
    font-size: 48px;
    margin-bottom: 12px;
    animation: floaty 4s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-10px); }
  }
  #lockScreen h1{
    font-weight: 500;
    font-size: 22px;
    color: var(--accent);
    margin: 0 0 6px 0;
  }
  #lockScreen p{
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 28px 0;
  }
  #pw{
    width: 100%;
    max-width: 280px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid #3d3656;
    background: var(--bg-soft);
    color: var(--text);
    font-size: 16px;
    text-align:center;
    outline: none;
    transition: border-color .2s;
  }
  #pw:focus{ border-color: var(--accent); }
  #unlockBtn{
    margin-top: 14px;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #221a33;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, opacity .15s;
  }
  #unlockBtn:active{ transform: scale(0.97); }
  #unlockBtn:disabled{ opacity: .5; cursor: default; }
  #err{
    color: var(--error);
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
  }

  /* ---------- صفحه‌ی محتوا ---------- */
  #contentScreen{
    display:none;
    width: 100%;
    max-width: 640px;
    padding: 28px 16px 60px 16px;
  }
  #contentScreen.show{ display:block; animation: fadein .6s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .heading{
    text-align:center;
    margin-bottom: 24px;
  }
  .heading .moon{ font-size: 34px; }
  .heading h2{ font-weight:500; font-size:19px; color:var(--accent); margin:6px 0 2px; }
  .heading p{ color:var(--text-dim); font-size:13px; margin:0; }

  .tabs{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content:center;
    margin-bottom: 22px;
  }
  .tab{
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--bg-soft);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all .2s;
    white-space: nowrap;
  }
  .tab.active{
    background: var(--accent);
    color: #221a33;
    font-weight: 600;
  }

  .panel{ display:none; }
  .panel.active{ display:block; animation: fadein .4s ease; }

  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .grid img{
    width:100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
  }

  .item-card{
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .item-card video{ width:100%; border-radius: 10px; display:block; }
  .item-card audio{ width:100%; }
  .caption{
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 8px;
  }
  .letter-text{
    white-space: pre-wrap;
    line-height: 2;
    font-size: 15px;
    color: var(--text);
  }

  .empty{
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 30px 0;
  }

  /* لایت‌باکس عکس */
  #lightbox{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(10,8,18,0.92);
    z-index: 50;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  #lightbox.show{ display:flex; }
  #lightbox img{ max-width:100%; max-height:100%; border-radius: 10px; }

  .loading{
    text-align:center;
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px 0;
  }
</style>
</head>
<body>

  <!-- ====== صفحه‌ی قفل / رمز ====== -->
  <div id="lockScreen">
    <div class="moon">🌙</div>
    <h1>یه چیزی برات نگه داشتم</h1>
    <p>برای دیدنش، رمز رو وارد کن</p>
    <input type="password" id="pw" placeholder="رمز عبور" autocomplete="off" />
    <br/>
    <button id="unlockBtn">باز کن</button>
    <div id="err"></div>
  </div>

  <!-- ====== صفحه‌ی محتوا (بعد از رمز درست) ====== -->
  <div id="contentScreen">
    <div class="heading">
      <div class="moon">🤍</div>
      <h2>تولدت مبارک</h2>
      <p>یه مشت خاطره و آدم که دوستت دارن</p>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
  </div>

  <div id="lightbox"><img id="lightboxImg" /></div>

<script>
(function(){
  const lockScreen = document.getElementById('lockScreen');
  const contentScreen = document.getElementById('contentScreen');
  const pwInput = document.getElementById('pw');
  const unlockBtn = document.getElementById('unlockBtn');
  const errBox = document.getElementById('err');
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  const CATEGORY_LABELS = {
    photos: 'عکس‌ها 📷',
    videos: 'ویدیوها 🎬',
    songs: 'آهنگ‌ها 🎵',
    voices: 'صدای رفقا 💬',
    letter: 'نامه 💌'
  };
  const CATEGORY_ORDER = ['photos', 'videos', 'songs', 'voices', 'letter'];

  let manifest = null;
  let salt = null;
  let cryptoKey = null;

  function b64ToBuf(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  async function deriveKey(password, saltBuf){
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: saltBuf, iterations: 200000, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function decryptItem(item, key){
    const res = await fetch(item.file);
    const buf = await res.arrayBuffer();
    const bytes = new Uint8Array(buf);
    const iv = bytes.slice(0, 12);
    const data = bytes.slice(12); // شامل ciphertext + تگ ۱۶ بایتی است
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return new Blob([plainBuf], { type: item.mime || 'application/octet-stream' });
  }

  async function decryptCaption(captionEnc, key){
    if (!captionEnc) return '';
    const bytes = new Uint8Array(b64ToBuf(captionEnc));
    const iv = bytes.slice(0, 12);
    const data = bytes.slice(12);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(plainBuf);
  }

  function renderItem(item, blob, caption){
    const url = URL.createObjectURL(blob);
    if (item.mime && item.mime.startsWith('image/')){
      const img = document.createElement('img');
      img.src = url;
      img.loading = 'lazy';
      img.addEventListener('click', () => {
        lightboxImg.src = url;
        lightbox.classList.add('show');
      });
      return img;
    }
    if (item.mime && item.mime.startsWith('video/')){
      const wrap = document.createElement('div');
      wrap.className = 'item-card';
      const v = document.createElement('video');
      v.src = url; v.controls = true; v.playsInline = true;
      wrap.appendChild(v);
      if (caption){
        const cap = document.createElement('div');
        cap.className = 'caption'; cap.textContent = caption;
        wrap.appendChild(cap);
      }
      return wrap;
    }
    if (item.mime && item.mime.startsWith('audio/')){
      const wrap = document.createElement('div');
      wrap.className = 'item-card';
      if (caption){
        const cap = document.createElement('div');
        cap.className = 'caption'; cap.textContent = caption;
        cap.style.marginBottom = '8px'; cap.style.marginTop = '0';
        wrap.appendChild(cap);
      }
      const a = document.createElement('audio');
      a.src = url; a.controls = true;
      wrap.appendChild(a);
      return wrap;
    }
    if (item.mime && item.mime.startsWith('text/')){
      const wrap = document.createElement('div');
      wrap.className = 'item-card';
      const p = document.createElement('div');
      p.className = 'letter-text';
      blob.text().then(t => { p.textContent = t; });
      wrap.appendChild(p);
      return wrap;
    }
    const wrap = document.createElement('div');
    wrap.className = 'item-card';
    wrap.textContent = caption || 'فایل';
    return wrap;
  }

  async function buildPanel(category, items){
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + category;

    if (!items.length){
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'چیزی اینجا نیست';
      panel.appendChild(e);
      panelsEl.appendChild(panel);
      return panel;
    }

    const loading = document.createElement('div');
    loading.className = 'loading';
    loading.textContent = 'در حال باز کردن...';
    panel.appendChild(loading);
    panelsEl.appendChild(panel);

    const isGrid = category === 'photos';
    const container = document.createElement('div');
    container.className = isGrid ? 'grid' : '';

    for (const item of items){
      try{
        const [blob, caption] = await Promise.all([
          decryptItem(item, cryptoKey),
          decryptCaption(item.captionEnc, cryptoKey)
        ]);
        const el = renderItem(item, blob, caption);
        container.appendChild(el);
      }catch(e){
        console.error('decrypt failed for', item.file, e);
      }
    }

    panel.removeChild(loading);
    panel.appendChild(container);
    return panel;
  }

  function activateTab(category){
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.cat === category));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + category));
  }

  async function buildUI(){
    const byCategory = {};
    CATEGORY_ORDER.forEach(c => byCategory[c] = []);
    manifest.forEach(item => {
      if (!byCategory[item.category]) byCategory[item.category] = [];
      byCategory[item.category].push(item);
    });

    for (const cat of CATEGORY_ORDER){
      if (!(cat in byCategory)) continue;
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.dataset.cat = cat;
      tab.textContent = CATEGORY_LABELS[cat] || cat;
      tab.addEventListener('click', () => activateTab(cat));
      tabsEl.appendChild(tab);

      await buildPanel(cat, byCategory[cat]);
    }

    const firstCat = CATEGORY_ORDER.find(c => byCategory[c] && byCategory[c].length) || CATEGORY_ORDER[0];
    activateTab(firstCat);
  }

  async function tryUnlock(){
    const password = pwInput.value;
    if (!password){ return; }
    unlockBtn.disabled = true;
    errBox.textContent = '';

    try{
      if (!manifest){
        const [manRes, saltRes] = await Promise.all([
          fetch('manifest.json'),
          fetch('encrypted/salt.txt')
        ]);
        manifest = await manRes.json();
        const saltB64 = (await saltRes.text()).trim();
        salt = b64ToBuf(saltB64);
      }

      const key = await deriveKey(password, salt);

      // تلاش برای رمزگشایی اولین فایل، فقط برای تست درست بودن رمز
      await decryptItem(manifest[0], key);

      cryptoKey = key;
      lockScreen.style.display = 'none';
      contentScreen.classList.add('show');
      contentScreen.style.display = 'block';
      await buildUI();

    }catch(e){
      errBox.textContent = 'رمز درست نیست، دوباره امتحان کن';
      unlockBtn.disabled = false;
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
  lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
})();
</script>
</body>
</html>
