<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برای تو</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #1a1423;
      --bg-soft: #241c31;
      --card: #2e253d;
      --text: #f3ebe0;
      --text-dim: #c4b8a8;
      --accent: #d4a574;
      --accent-2: #c47a5a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    #lockScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a12 url('sky.jpg') center/cover no-repeat;
      z-index: 100;
      transition: opacity 1.1s ease;
    }
    #lockScreen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 8, 20, 0.48);
      z-index: 1;
    }
    #lockScreen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .lock-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .moon {
      font-size: 52px;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 12px rgba(212, 165, 116, 0.35));
    }

    .lock-title {
      font-size: 24px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    .lock-poem {
      font-size: 15px;
      color: #e8e0d5;
      line-height: 1.95;
      max-width: 300px;
      margin-bottom: 28px;
      min-height: 55px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }

    #pw {
      width: 250px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(212, 165, 116, 0.35);
      background: rgba(20, 16, 30, 0.75);
      color: var(--text);
      font-size: 16px;
      text-align: center;
      outline: none;
      backdrop-filter: blur(6px);
    }
    #pw:focus {
      border-color: var(--accent);
    }

    #unlockBtn {
      margin-top: 14px;
      padding: 12px 36px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #d4a574, #c47a5a);
      color: #1a1423;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }

    #err {
      color: #ffb4b4;
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
    }

    #contentScreen {
      display: none;
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }
    #contentScreen.show { display: block; }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 24px;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .header p { color: var(--text-dim); font-size: 14px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .tab {
      padding: 9px 16px;
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
    }
    .tab.active {
      background: linear-gradient(135deg, #d4a574, #c47a5a);
      color: #1a1423;
      font-weight: 600;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div id="lockScreen">
    <div class="lock-content">
      <div class="moon">🌙</div>
      <div class="lock-title">برای تو</div>
      <div class="lock-poem" id="poem"></div>
      <input type="password" id="pw" placeholder="رمز ورود" autocomplete="off" />
      <button id="unlockBtn">باز کن</button>
      <div id="err"></div>
    </div>
  </div>

  <div id="contentScreen">
    <div class="header">
      <h1>تولدت مبارک</h1>
      <p>یه گوشه از دل من برات</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="beauty">زیبایی‌ها</div>
      <div class="tab" data-tab="quotes">جملات قصار</div>
      <div class="tab" data-tab="memories">خاطرات</div>
      <div class="tab" data-tab="friends">همراهان</div>
      <div class="tab" data-tab="us">ما</div>
    </div>

    <div class="panel active" id="panel-beauty">
      <div class="card">اینجا عکس‌ها قرار می‌گیرن...</div>
    </div>
    <div class="panel" id="panel-quotes">
      <div class="card">جملات قصار...</div>
    </div>
    <div class="panel" id="panel-memories">
      <div class="card">خاطرات...</div>
    </div>
    <div class="panel" id="panel-friends">
      <div class="card">همراهان...</div>
    </div>
    <div class="panel" id="panel-us">
      <div class="card">بخش ما...</div>
    </div>
  </div>

  <script>
    const poemText = `در این شبِ پاییزی
ستاره‌ها به یاد تو روشن‌اند`;
    const poemEl = document.getElementById('poem');
    let idx = 0;
    function type() {
      if (idx <= poemText.length) {
        poemEl.textContent = poemText.slice(0, idx);
        idx++;
        setTimeout(type, 60);
      }
    }
    setTimeout(type, 400);

    const CORRECT_PASSWORD = "test123";

    const lockScreen = document.getElementById('lockScreen');
    const contentScreen = document.getElementById('contentScreen');
    const pw = document.getElementById('pw');
    const btn = document.getElementById('unlockBtn');
    const err = document.getElementById('err');

    function tryUnlock() {
      if (pw.value.trim() === CORRECT_PASSWORD) {
        lockScreen.classList.add('hide');
        setTimeout(() => {
          lockScreen.style.display = 'none';
          contentScreen.classList.add('show');
        }, 1000);
      } else {
        err.textContent = 'رمز درست نیست';
      }
    }

    btn.addEventListener('click', tryUnlock);
    pw.addEventListener('keydown', e => {
      if (e.key === 'Enter') tryUnlock();
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      });
    });
  </script>
</body>
</html>
